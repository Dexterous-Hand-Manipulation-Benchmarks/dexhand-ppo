# @package _global_
# Benchmark protocol (lab report Table VI), identical to dexhand-bench scripts/slurm/ppo.sbatch. The adapter adds
# -B, --hand, --clip, --seed, --max_epochs and --rand_init_ratio from the keys below.
env:
  kind: dexmachina
  num_envs: 4096
  dexmachina:
    hand: allegro_hand
    clip: box-30-230
    curriculum_max_epochs: 10000
    num_eval_envs: 16
    args: [
      -obf, -obt, --actuate_object, --retarget_name, para, -imw, "0.5", --gain_mode, all, --curr_schedule, uniform,
      --wait_epochs, "100", --contact_beta, "10", --upper_ratios, "0.9", "0.9", "1", --lower_ratios, "0.8", "0.8",
      "1", --group_collisions, --fixed_mode, uniform, --uniform_mode, slow, --action_penalty, "0.01",
      --dialback_ep_len, "80", --skip_grad, --deque_len, "30", --task_rew_betas, "10", "1", "5",
      --use_retarget_contact, --aux_reset_thres, "0", "0", "0", --curr_rew_thres, "0.6", "0.01", "0.01", "0.01",
      -am, hybrid, --hybrid_scales, "0.1", "1.0", --kp_init, "80", --kv_init, "5", -imi, "0.3", -bc, "0.3",
      -con, "3", -ert, "0.6",
    ]
ppo:
  num_steps: 32
