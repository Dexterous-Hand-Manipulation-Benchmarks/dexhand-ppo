# @package _global_
# dexmachina's benchmark task (dexmachina.envs.benchmark_task): the run chooses hand, clip, seed and num_envs;
# every other env setting is fixed there, the same for every method.
env:
  kind: dexmachina
  num_envs: 4096
  dexmachina:
    hand: allegro_hand
    clip: box-30-230
ppo:
  num_steps: 32
